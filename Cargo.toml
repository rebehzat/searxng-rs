[package]
name = "searxng-rs"
version = "0.4.0"
edition = "2024"
description = "A single-binary, agent-friendly metasearch CLI"
license = "AGPL-3.0-or-later"
repository = "https://github.com/rebehzat/searxng-rs"
readme = "README.md"
keywords = ["search", "metasearch", "cli", "agents"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "gzip", "query"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
